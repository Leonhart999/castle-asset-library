<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<link rel=icon href=data:,>
<title>Castle Asset Library - module viewer</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#aeb9c4;font:13px/1.4 system-ui,sans-serif}
canvas{display:block}
.hud{position:fixed;left:12px;top:12px;max-height:calc(100% - 24px);overflow:auto;background:rgba(20,22,26,.84);color:#e8e6e0;border-radius:8px;padding:10px;min-width:230px}
.hud h1{font-size:14px;margin:0 0 8px}
.hud button{display:block;width:100%;text-align:left;margin:2px 0;padding:4px 8px;background:none;border:0;color:inherit;border-radius:4px;cursor:pointer;font:inherit}
.hud button:hover{background:rgba(255,255,255,.12)}
.hud button.on{background:#c9a15a;color:#1b1b1b}
.hud .cat{opacity:.55;margin:8px 0 2px;font-size:11px;text-transform:uppercase}
.hud .info{opacity:.8;margin-top:10px;max-width:230px;font-size:12px}
</style>
</head>
<body>
<script type=module src=./main.js></script>
</body>
</html>
